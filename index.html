<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Cantina - Menú</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="header-content">
            <img src="images/Logo.png" alt="Tabú Bar" class="logo">
            <div class="header-text">
                <h1>Tabú Bar</h1>
                <div class="subtitle">RESTAURANTE & BAR</div>
            </div>
        </div>
    </header>

    <nav class="tabs-container">
        <div class="tabs">
            <button class="tab active" onclick="scrollToSection('tragos')">
                <span class="tab-icon">🍸</span>
                <span class="tab-text">Tragos</span>
            </button>
            <button class="tab" onclick="scrollToSection('cervezas')">
                <span class="tab-icon">🍺</span>
                <span class="tab-text">Cervezas</span>
            </button>
            <button class="tab" onclick="scrollToSection('pizzas')">
                <span class="tab-icon">🍕</span>
                <span class="tab-text">Pizzas</span>
            </button>
            <button class="tab" onclick="scrollToSection('lomos')">
                <span class="tab-icon">🥩</span>
                <span class="tab-text">Lomos</span>
            </button>
            <button class="tab" onclick="scrollToSection('papas')">
                <span class="tab-icon">🍟</span>
                <span class="tab-text">Papas</span>
            </button>
            <button class="tab" onclick="scrollToSection('helados')">
                <span class="tab-icon">🍦</span>
                <span class="tab-text">Helados</span>
            </button>
            <button class="tab" onclick="scrollToSection('gaseosas')">
                <span class="tab-icon">🥤</span>
                <span class="tab-text">Gaseosas</span>
            </button>
        </div>
    </nav>

    <div class="content">
        <!-- El menú se cargará dinámicamente desde menu.json -->
    </div>

    <div class="footer">
        <p>📍 Nueva Galia, San Luis, Argentina</p>
        <p>📞 Reservas: (266) 123-4567</p>
        <p style="margin-top: 15px; font-size: 0.8em;">Gracias por Elegirnos ♥</p>
    </div>
</body>
</html>
